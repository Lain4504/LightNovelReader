name: DebugApkBuild
on:
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - app/src/**
      - api/src/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  BuildDebugApk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Retrieve Version
        run: |
          chmod +x ./gradlew
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> $GITHUB_OUTPUT
        id: android_version
        
      - name: Build debug APK
        run: ./gradlew assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: LightNovelReader-${{steps.android_version.outputs.VERSION_CODE}}-debug
          path: app/build/outputs/apk/debug/*
