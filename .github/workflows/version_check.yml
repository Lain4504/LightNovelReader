name: VersionCheck
on:
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - app/src/**
      - api/src/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get version from PR
        id: get-pr-version
        run: |
          chmod +x ./gradlew
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> $GITHUB_OUTPUT

      - name: Get current version from target branch
        id: get-current-version
        run: |
          TARGET_BRANCH=${{ github.base_ref || 'main' }}
          echo "Checking against branch: $TARGET_BRANCH"
          git checkout origin/$TARGET_BRANCH
          chmod +x ./gradlew
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare-versions
        run: |
          PR_VER=${{ steps.get-pr-version.outputs.VERSION_CODE }}
          CUR_VER=${{ steps.get-current-version.outputs.VERSION_CODE }}
          
          echo "PR Version Code: $PR_VER"
          echo "Current Branch Version Code: $CUR_VER"
          
          if [ "$PR_VER" -le "$CUR_VER" ]; then
            echo "Error: The version code in the PR ($PR_VER) is not higher than the current version ($CUR_VER)."
            echo "Please increase the versionCode in app/build.gradle.kts."
            exit 1
          else
            echo "Version check passed."
          fi
