name: ReleaseApkBuild
on:
  push:
    branches: [main]
    paths:
      - app/src/**
      - api/src/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  BuildReleaseApk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Retrieve Version
        run: |
          chmod +x ./gradlew
          echo "VERSION_NAME=$(./gradlew -q app:printVersion)" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> $GITHUB_OUTPUT
        id: android_version
        
      - name: Build release APK
        run: ./gradlew assembleRelease
        
      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          
      - uses: actions/upload-artifact@v4
        with:
          name: LightNovelReader-${{steps.android_version.outputs.VERSION_NAME}}-${{steps.android_version.outputs.VERSION_CODE}}-release
          path: |
            ${{steps.sign_app.outputs.signedReleaseFile}}
            app/build/outputs/mapping/release/mapping.txt

